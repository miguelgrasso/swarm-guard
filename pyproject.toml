[project]
name = "swarm-guard"
version = "0.1.0"
description = "Benchmark that demonstrates Strands Agents Swarm security controls are off by default"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "strands-agents==1.64.0",
    "PyYAML",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_guard"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
# .claude/ holds harness tooling (spec-board dashboard bridge), not project code
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are skipped by default; run them with `uv run pytest -m integration`
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
